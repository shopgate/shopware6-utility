name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (CI)
        run: npm run test:ci

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: junit.xml
          if-no-files-found: ignore

      - name: Upload Cobertura coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-coverage
          path: coverage/cobertura-coverage.xml
          if-no-files-found: ignore

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Determine npm dist-tag
        id: dist_tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if echo "$TAG_NAME" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "value=latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        run: npm publish --access public --tag "${{ steps.dist_tag.outputs.value }}"